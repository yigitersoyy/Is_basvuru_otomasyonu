[project]
name = "career-outreach"
version = "0.1.0"
description = "Local-first, evidence-backed career application workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1", "pypdf>=5.4,<7", "python-docx>=1.1,<2",
  "docxtpl>=0.20,<1", "httpx>=0.28,<1", "email-validator>=2.2,<3"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["services/api/career_app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
